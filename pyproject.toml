[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-create-account"
version = "0.1.0"
description = "Service for integrating with Entra ID, Google Workspace, and on-premises Active Directory"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Viktor Yatsenko"}
]

dependencies = [
    "fastapi>=0.142.0",
    "fastapi-babel>=1.0.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "msal>=1.39.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
